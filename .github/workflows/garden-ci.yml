# Upstream .github/workflows are switched off in this repository with the repository variable DISABLE_GODOT_CI=1.

name: Garden CI

on:
  push:
    branches: [main, nomad/dev, darkstar/dev]
    tags: ["engine-4.8.0-dev-*"]
  pull_request:
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}|${{ github.ref }}
  # Tags and main must finish (especially publish-release); job-level engine-release is not enough alone.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  SCONS_FLAGS: dev_mode=yes module_text_server_fb_enabled=yes debug_symbols=no
  GODOT_VERSION_STATUS: dev-double
  PYTHONIOENCODING: utf8
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  SCONS_CACHE_LIMIT: 3072
  GODOT_TEST_WORKER_THREADS: "8"

jobs:
  editor-build-scope:
    name: Determine editor build scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      build: ${{ steps.scope.outputs.build }}
    steps:
      - id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_FILES: ${{ github.event.pull_request.changed_files }}
        run: |
          build=true
          if [[ "$GITHUB_EVENT_NAME" == pull_request && "$PR_FILES" =~ ^[0-9]+$ && "$PR_FILES" -gt 0 && "$PR_FILES" -lt 3000 ]]; then
            if gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" > "$RUNNER_TEMP/pr-files.json"; then
              build=$(jq -er --argjson expected "$PR_FILES" '
                [ .[][] ] as $files |
                [ $files[] | .filename, (.previous_filename // empty) ] as $paths |
                if ($files | length) != $expected then error("incomplete PR file list")
                elif all($paths[]; startswith(".github/") or (ascii_downcase | endswith(".md"))) then "false"
                else "true" end
              ' "$RUNNER_TEMP/pr-files.json") || build=true
            fi
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"

  static-checks:
    name: Static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: .gitignore checks
        run: bash ./misc/scripts/gitignore_check.sh

      - name: Style checks via prek
        env:
          SKIP: dotnet-format
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          python -m pip install --disable-pip-version-check prek
          from_ref="${PR_BASE_SHA:-$PUSH_BEFORE_SHA}"
          if [ -z "$from_ref" ] || ! git cat-file -e "${from_ref}^{commit}" 2>/dev/null; then
            from_ref=HEAD~1
          fi
          prek run --show-diff-on-failure --color=always --from-ref "$from_ref" --to-ref HEAD

      # Runs whenever the npm tree or the check itself can differ from what was last verified:
      #  the manifests (Dependabot bumps), the eslint config (rule changes), and this workflow
      #  (so a change to the gate exercises the gate on its own pull request).
      - name: Detect platform/web npm lint inputs
        id: web-npm
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          from_ref="${PR_BASE_SHA:-$PUSH_BEFORE_SHA}"
          if [ -z "$from_ref" ] || ! git cat-file -e "${from_ref}^{commit}" 2>/dev/null; then
            from_ref=HEAD~1
          fi
          if git diff --name-only "$from_ref" HEAD | grep -qxF \
            -e platform/web/package.json \
            -e platform/web/package-lock.json \
            -e platform/web/eslint.config.cjs \
            -e .github/workflows/garden-ci.yml; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js for platform/web
        if: steps.web-npm.outputs.changed == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: platform/web/package-lock.json

      # Prints the versions actually installed from the manifest under test, so a Dependabot
      #  pull request shows the bumped packages in this job's log.
      - name: Show installed platform/web devDependencies
        if: steps.web-npm.outputs.changed == 'true'
        working-directory: platform/web
        run: npm ls --depth=0

      - name: platform/web npm lint
        if: steps.web-npm.outputs.changed == 'true'
        working-directory: platform/web
        run: |
          npm ci
          npm run lint

  linux-editor:
    name: Linux editor (double, Mono)
    needs: editor-build-scope
    if: ${{ needs.editor-build-scope.outputs.build == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.x

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-bin gdb
          python -m pip install --disable-pip-version-check scons==4.11.1 zstandard
          dotnet --version
          scons --version
          echo "SCONS_CACHE=$RUNNER_TEMP/scons-cache" >> "$GITHUB_ENV"
          echo "CACHE_TIMESTAMP=$(date +%s)" >> "$GITHUB_ENV"

      - name: Restore SCons cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/scons-cache
          key: scons-linux-editor-${{ github.sha }}
          restore-keys: scons-linux-editor-

      - name: Build editor
        run: |
          export GODOT_VERSION_STATUS="dev-double${GITHUB_RUN_NUMBER}"
          scons platform=linuxbsd target=editor precision=double module_mono_enabled=yes tests=yes $SCONS_FLAGS -j"$(nproc)"

      - name: Purge stale SCons cache entries
        continue-on-error: true
        run: python misc/scripts/purge_cache.py "$CACHE_TIMESTAMP" "$SCONS_CACHE"

      - name: Save SCons cache
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/scons-cache
          key: scons-linux-editor-${{ github.sha }}

      - name: Generate Mono glue and build assemblies
        run: |
          export GODOT_VERSION_STATUS="dev-double${GITHUB_RUN_NUMBER}"
          ./bin/godot.linuxbsd.editor.double.x86_64.mono --headless --generate-mono-glue modules/mono/glue
          python modules/mono/build_scripts/build_assemblies.py --godot-output-dir=./bin --precision=double

      - name: Unit tests
        timeout-minutes: 45
        run: |
          stdbuf -oL -eL ./bin/godot.linuxbsd.editor.double.x86_64.mono --headless --test --force-colors -s &
          pid=$!
          (sleep 1200; echo "::error::Unit tests still running after 20 minutes; dumping thread stacks"; nproc
            for g in "gdb" "sudo -n gdb"; do
              out=$($g -p "$pid" -batch -ex "thread apply all bt" 2>&1 || true)
              case "$out" in *"Thread "*) echo "$out" | tail -n 800; break ;; *) echo "$g: $out" | tail -n 5 ;; esac
            done
            grep -E "VmRSS|Threads" /proc/$pid/status || true
            kill -9 "$pid") &
          watchdog=$!
          rc=0; wait "$pid" || rc=$?
          kill "$watchdog" 2>/dev/null || true
          wait "$watchdog" 2>/dev/null || true
          exit "$rc"

      - name: Package editor
        run: |
          mkdir -p package
          cp bin/godot.linuxbsd.editor.double.x86_64.mono package/
          cp -r bin/GodotSharp package/

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: godot-4.8-double-mono-linux64
          path: package/
          retention-days: 14

  windows-editor:
    name: Windows editor (MSVC, double, Mono)
    needs: editor-build-scope
    if: ${{ needs.editor-build-scope.outputs.build == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 240
    env:
      SCONS_CACHE_MSVC_CONFIG: true
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: 10.0.x

      - name: Install build tools
        run: |
          python -m pip install --disable-pip-version-check scons==4.11.1 zstandard
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          dotnet --version
          python -m SCons --version
          python misc/scripts/install_d3d12_sdk_windows.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python misc/scripts/install_accesskit.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "SCONS_CACHE=$env:RUNNER_TEMP\scons-cache" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CACHE_TIMESTAMP=$([DateTimeOffset]::UtcNow.ToUnixTimeSeconds())" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Restore SCons cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}\scons-cache
          key: scons-windows-editor-${{ github.sha }}
          restore-keys: scons-windows-editor-

      - name: Build editor
        run: |
          $env:GODOT_VERSION_STATUS = "dev-double$env:GITHUB_RUN_NUMBER"
          python -m SCons platform=windows target=editor precision=double module_mono_enabled=yes tests=yes windows_subsystem=console $env:SCONS_FLAGS.Split(' ') -j $env:NUMBER_OF_PROCESSORS

      - name: Purge stale SCons cache entries
        continue-on-error: true
        run: python misc/scripts/purge_cache.py $env:CACHE_TIMESTAMP $env:SCONS_CACHE

      - name: Save SCons cache
        continue-on-error: true
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}\scons-cache
          key: scons-windows-editor-${{ github.sha }}

      - name: Generate Mono glue and build assemblies
        run: |
          $env:GODOT_VERSION_STATUS = "dev-double$env:GITHUB_RUN_NUMBER"
          ./bin/godot.windows.editor.double.x86_64.mono.exe --headless --generate-mono-glue modules/mono/glue
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python modules/mono/build_scripts/build_assemblies.py --godot-output-dir=./bin --precision=double

      - name: Unit tests
        timeout-minutes: 45
        shell: pwsh
        run: |
          $tests = Start-Process -FilePath ./bin/godot.windows.editor.double.x86_64.mono.exe -ArgumentList '--headless', '--test', '--force-colors' -PassThru -NoNewWindow
          if (-not $tests.WaitForExit(1200000)) {
            Write-Host "::error::Unit tests still running after 20 minutes; capturing a hang dump"
            $hang = Join-Path $env:RUNNER_TEMP "unit-tests-hang.dmp"
            Get-Process -Id $tests.Id | Format-List Id, CPU, Threads, WorkingSet64 | Out-String | Write-Host
            try {
              $dump = Start-Process -FilePath "$env:SystemRoot\System32\rundll32.exe" -ArgumentList "C:\Windows\System32\comsvcs.dll, MiniDump $($tests.Id) $hang full" -PassThru -Wait -NoNewWindow
              Write-Host "hang dump exit $($dump.ExitCode)"
            } catch {
              Write-Host "hang dump failed: $($_.Exception.Message)"
            }
            Stop-Process -Id $tests.Id -Force
            exit 1
          }
          exit $tests.ExitCode

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: unit-tests-hang-dump
          path: ${{ runner.temp }}/unit-tests-hang.dmp
          retention-days: 7
          if-no-files-found: ignore

      - name: Mono shutdown tracker regression
        run: python tests/mono_shutdown_tracker/run.py --candidate bin/godot.windows.editor.double.x86_64.mono.exe --output shutdown-tracker-logs

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: mono-shutdown-tracker-logs
          path: shutdown-tracker-logs/
          retention-days: 7
          if-no-files-found: ignore

      - name: Package editor
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item bin\godot.windows.editor.double.x86_64.mono*.exe package\
          Copy-Item bin\*.dll package\ -ErrorAction SilentlyContinue
          Copy-Item -Recurse bin\GodotSharp package\

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: godot-4.8-double-mono-win64
          path: package/
          retention-days: 14

  publish-release:
    name: Publish engine release
    needs: [static-checks, linux-editor, windows-editor]
    if: ${{ github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/engine-4.8.0-dev-') || github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: engine-release
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: godot-4.8-double-mono-win64
          path: stage/win64

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: godot-4.8-double-mono-linux64
          path: stage/linux64

      - name: Zip release assets
        run: |
          set -euo pipefail
          chmod +x stage/linux64/godot.*
          mkdir -p assets
          for p in win64 linux64; do
            name=godot-4.8.0-dev-double-mono-$p.zip
            test -n "$(ls stage/$p/godot.*.editor.double.x86_64.mono*)"
            (cd stage/$p && python3 -m zipfile -c "../../assets/$name" .)
            (cd assets && sha256sum "$name" > "$name.sha256")
          done
          ls -l assets

      - name: Publish GitHub release
        env:
          TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: |
          set -euo pipefail
          TAG=${TAG:-engine-4.8.0-dev-${GITHUB_SHA:0:10}}
          pkg=$(ls stage/linux64/GodotSharp/Tools/nupkgs/ | sed -n 's/^Godot\.NET\.Sdk\.\(.*\)\.nupkg$/\1/p')
          test -n "$pkg"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" assets/* --clobber
          else
            gh release create "$TAG" assets/* --target "$GITHUB_SHA" \
              --title "Garden engine 4.8.0-dev double + Mono (${GITHUB_SHA:0:10})" \
              --notes "Built by CI from $GITHUB_SHA. .NET packages: $pkg."
          fi

      - name: Notify Garden-Engine engine-update
        env:
          DISPATCH_TOKEN: ${{ secrets.GARDEN_ENGINE_DISPATCH_TOKEN }}
          TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: |
          set -euo pipefail
          TAG=${TAG:-engine-4.8.0-dev-${GITHUB_SHA:0:10}}
          if [ -z "${DISPATCH_TOKEN:-}" ]; then
            echo "::warning::GARDEN_ENGINE_DISPATCH_TOKEN is not set; Garden-Engine will rely on its engine-update schedule."
            exit 0
          fi
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -X POST "https://api.github.com/repos/G-A-R-D-E-N/Garden-Engine/dispatches" \
            -d "{\"event_type\":\"engine-release-published\",\"client_payload\":{\"tag\":\"$TAG\"}}"
          echo "Requested Garden-Engine engine-update for $TAG"
